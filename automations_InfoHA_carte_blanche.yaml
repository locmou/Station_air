# ========================================
# AUTOMATIONS HOME ASSISTANT - MODE InfoHA CARTE BLANCHE
# Configuration totalement flexible
# ========================================

# ===== MÉTHODE 1 : DIRECT (changement d'état) =====
# Envoyer immédiatement quand le sensor change

  alias: ESP32 - Slot 1
  description: Envoyer données slot 1
  triggers:
     - entity_id: sensor.routeur_rms_energie_jour_m_soutiree
       trigger: state
  actions:
     - data:
         topic: stationair/data/slot1
         payload_template: "{{ states('sensor.routeur_rms_energie_jour_m_soutiree') | round(0) }}"
       action: mqtt.publish

  alias: ESP32 - Slot 2
  description: Envoyer données slot 2
  triggers:
     - entity_id: sensor.elec_moun_s_puissance
       trigger: state
  actions:
    - data:
        topic: stationair/data/slot2
        payload_template: "{{ states('sensor.elec_moun_s_puissance') | round(0) }}"
      action: mqtt.publish

  alias: ESP32 - Slot 3
  description: Envoyer données slot 3
  triggers:
    - entity_id: weather.forecast_maison
      trigger: state
  actions:
    - data:
        topic: stationair/data/slot3
        payload_template: "{{ state_attr('weather.forecast_maison', 'temperature') | round(1) }}"
      action: mqtt.publish

  alias: ESP32 - Slot 4
  description: Envoyer données slot 4
  triggers:
    - entity_id: sensor.rennes_ballon_evier_relais_ouverture
      trigger: state
  actions:
    - data:
        topic: stationair/data/slot4
        payload_template: "{{ states('sensor.rennes_ballon_evier_relais_ouverture') | round(0) }}"
      action: mqtt.publish

# ========================================
# MÉTHODE 2 : PÉRIODIQUE (toutes les 30s)
# ========================================
  alias: ESP32 - Rafraîchir InfoHA
  description: Envoyer toutes les valeurs toutes les 30s
  triggers:
    - seconds: /30
      trigger: time_pattern
  actions:
    - data:
        topic: stationair/data/slot1
        payload_template: >-
          {{ states('sensor.routeur_rms_energie_jour_m_soutiree') | float(0) |
          round(0) }}
      action: mqtt.publish
    - data:
        topic: stationair/data/slot2
        payload_template: "{{ states('sensor.elec_moun_s_puissance') | float(0) | round(0) }}"
      action: mqtt.publish
    - data:
        topic: stationair/data/slot3
        payload_template: >-
          {{ state_attr('weather.forecast_maison', 'temperature') | float(0) |
          round(1) }}
      action: mqtt.publish
    - data:
        topic: stationair/data/slot4
        payload_template: >-
          {{ states('sensor.rennes_ballon_evier_relais_ouverture') | float(0) |
          round(2) }}
      action: mqtt.publish


# ========================================
# MÉTHODE 3 : DYNAMIQUE avec HELPERS
# Permet de changer les sensors depuis HA sans modifier les automations
# ========================================

# D'abord créer 4 helpers "input_text" dans HA:
# Settings → Devices & Services → Helpers → Create Helper → Text
# - input_text.esp32_slot1_entity → "sensor.power_consumption"
# - input_text.esp32_slot2_entity → "sensor.solar_production"
# - input_text.esp32_slot3_entity → "sensor.outdoor_temperature"
# - input_text.esp32_slot4_entity → "sensor.daily_energy"

- alias: "ESP32 - Slots Dynamiques"
  description: "Envoyer les valeurs selon les entities configurées"
  trigger:
    - platform: time_pattern
      seconds: "/30"
    # Trigger aussi quand les sensors changent
    - platform: template
      value_template: >
        {{
          states(states('input_text.esp32_slot1_entity')) is not none or
          states(states('input_text.esp32_slot2_entity')) is not none or
          states(states('input_text.esp32_slot3_entity')) is not none or
          states(states('input_text.esp32_slot4_entity')) is not none
        }}
  action:
    # Slot 1
    - service: mqtt.publish
      data:
        topic: "stationair/data/slot1"
        payload: >
          {{ states(states('input_text.esp32_slot1_entity')) | float(0) | round(1) }}
    
    # Slot 2
    - service: mqtt.publish
      data:
        topic: "stationair/data/slot2"
        payload: >
          {{ states(states('input_text.esp32_slot2_entity')) | float(0) | round(1) }}
    
    # Slot 3
    - service: mqtt.publish
      data:
        topic: "stationair/data/slot3"
        payload: >
          {{ states(states('input_text.esp32_slot3_entity')) | float(0) | round(1) }}
    
    # Slot 4
    - service: mqtt.publish
      data:
        topic: "stationair/data/slot4"
        payload: >
          {{ states(states('input_text.esp32_slot4_entity')) | float(0) | round(1) }}

