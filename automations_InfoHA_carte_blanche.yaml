# ========================================
# EXEMPLES DE CONFIGURATION
# ========================================

# Exemple 1 : Maison avec PV
# Slot 1: "Puis" / "W" → sensor.power_consumption
# Slot 2: "PV" / "W" → sensor.solar_production
# Slot 3: "Text" / "°C" → sensor.outdoor_temperature
# Slot 4: "Bat" / "%" → sensor.battery_soc

# Exemple 2 : Maison sans PV
# Slot 1: "Puis" / "W" → sensor.power_consumption
# Slot 2: "Prix" / "€" → sensor.electricity_price
# Slot 3: "Text" / "°C" → sensor.outdoor_temperature
# Slot 4: "Conso" / "kWh" → sensor.daily_energy

# Exemple 3 : Routeur solaire
# Slot 1: "Puis" / "W" → sensor.power_consumption
# Slot 2: "PV" / "W" → sensor.solar_production
# Slot 3: "Triac" / "%" → sensor.triac_opening
# Slot 4: "Relais" / "%" → sensor.relay_opening

# ========================================
# TOPICS MQTT UTILISÉS
# ========================================

# Configuration (HA → ESP32, retain: true)
# stationair/config/slot1/label → Intitulé slot 1
# stationair/config/slot1/unit → Unité slot 1
# stationair/config/slot2/label → Intitulé slot 2
# stationair/config/slot2/unit → Unité slot 2
# stationair/config/slot3/label → Intitulé slot 3
# stationair/config/slot3/unit → Unité slot 3
# stationair/config/slot4/label → Intitulé slot 4
# stationair/config/slot4/unit → Unité slot 4

# Données (HA → ESP32)
# stationair/data/slot1 → Valeur slot 1
# stationair/data/slot2 → Valeur slot 2
# stationair/data/slot3 → Valeur slot 3
# stationair/data/slot4 → Valeur slot 4

# Mode (bidirectionnel)
# stationair/mode/set → Changer mode (temperature/pression/infoha)
# stationair/mode/state → État actuel du mode

# Capteurs (ESP32 → HA)
# stationair/data → JSON avec temperature, humidity, pressure, co
# stationair/status → online/offline
