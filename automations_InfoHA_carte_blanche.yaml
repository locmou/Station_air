# ========================================
# CONFIGURATION INITIALE (à faire UNE FOIS)
# ========================================

# Option 1 : Via l'interface HA
# 1. Aller dans l'appareil "Station Air"
# 2. Configurer chaque slot:
#    - "Slot 1 - Intitule" → saisir "Puis"
#    - "Slot 1 - Unite" → saisir "W"
#    - "Slot 2 - Intitule" → saisir "PV"
#    - "Slot 2 - Unite" → saisir "W"
#    - etc.

# Option 2 : Via automation au démarrage HA
- alias: "ESP32 - Configuration initiale des slots"
  description: "Configurer les intitulés et unités au démarrage HA"
  trigger:
    - platform: homeassistant
      event: start
  action:
    # Slot 1
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot1/label"
        payload: "Puis"
        retain: true
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot1/unit"
        payload: "W"
        retain: true
    
    # Slot 2
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot2/label"
        payload: "PV"
        retain: true
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot2/unit"
        payload: "W"
        retain: true
    
    # Slot 3
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot3/label"
        payload: "Temp"
        retain: true
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot3/unit"
        payload: "°C"
        retain: true
    
    # Slot 4
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot4/label"
        payload: "Conso"
        retain: true
    - service: mqtt.publish
      data:
        topic: "stationair/config/slot4/unit"
        payload: "kWh"
        retain: true

